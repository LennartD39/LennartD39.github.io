<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="author" content="Lennart D">
    <meta name="description" content="This is my cool website. I play on making a few games etc">
    <meta charset="utf-8" />
    <title>My Test Site</title>
    <link rel="icon" href="/minecraft favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="main">
      
      <div class="top-bar">
        
        <a href="/index.html"><img class="logo"src="logo_bismarck.png" alt="Logo nicht verfügbar"></a>
        <a href="/test.html"><button class="btn">Minesweeper Test</button></a>
        <a href="/index.html"><button class="btn">Tetris</button></a>
        <a href="/index.html"><button class="btn">About me</button></a>
      </div>

      <div class="screen">
        <h1>Number guessing game</h1>

        <p>
        We have selected a random number between 1 and 100. See if you can guess
        it in 10 turns or fewer. We'll tell you if your guess was too high or too
        low.
        </p>

        <div class="form">
          <label for="guessField">Enter a guess: </label>
          <input
            type="number"
            min="1"
            max="100"
            required
            id="guessField"
            class="guessField" />
          <input type="submit" value="Submit guess" class="guessSubmit" />
        </div>

        <div class="resultParas">
          <p class="guesses"></p>
          <p class="lastResult"></p>
          <p class="lowOrHi"></p>
        </div>

      </div>

    </div>
  </body>





</html>
